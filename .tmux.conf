# TPM (Tmux Plugin Manager) - must be at the top
set -g @plugin 'tmux-plugins/tpm'

# Plugin list
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'pwittchen/tmux-plugin-spotify'

set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'C-Space'
set -g @palette-find-pane-key 'M-f'
set -g @palette-move-pane-key 'M-m'

# Change prefix from Ctrl+B to Ctrl+A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

# Split pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Basic settings
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g base-index 0
set -g pane-base-index 0

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Clear history
bind -n C-k clear-history

# Switch panes using Alt+arrow without prefix
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D

set -g status-position bottom
set -g status-interval 1  # Update every second for smooth scrolling
set -g status-right '#(~/.tmux/scripts/spotify-scroll.sh) | #[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 100

# Window status
#setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
#setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Copy mode using vi keys (tmux-yank will enhance this)
#setw -g mode-keys vi
# These bindings work with tmux-yank plugin - commented out for default bindings
#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugin configurations
# tmux-resurrect: save/restore sessions
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-yank: copy to system clipboard
set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
